name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: infrabench validate
      - run: python -m build
      - run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/infrabench validate
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t infrabench .
      - run: docker run --rm --network none infrabench validate
      - run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$PWD/examples:/input:ro" -v "$PWD/reports:/output" infrabench evaluate /input/reference-responses.json --output /output --min-score 100
