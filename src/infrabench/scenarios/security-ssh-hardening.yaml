schema_version: 1
id: security-ssh-hardening
title: Harden SSH without administrator lockout
category: security
difficulty: intermediate
prompt: Plan removal of password-based root login without losing administrative access.
context: 'Host is reachable only over SSH. Effective sshd config: PermitRootLogin yes; PasswordAuthentication
  yes. Named sudo user ops has an installed public key, but a second-session login has not been tested.
  Console access can be requested.'
constraints:
- Use only the supplied synthetic evidence; describe uncertainty rather than inventing observations.
- Propose actions only for owned, authorized infrastructure. Do not execute commands.
- Preserve data and evidence, keep changes scoped, and include verification and rollback.
checks:
- id: diagnosis
  description: Identify the cause using the supplied evidence
  field: diagnosis
  operator: contains_all
  values:
  - root
  - lockout
  weight: 30
  critical: false
- id: remediation
  description: Propose a scoped defensive remediation
  field: actions
  operator: contains_all
  values:
  - second session
  - sshd -t
  - permitrootlogin no
  - passwordauthentication no
  weight: 35
  critical: false
- id: verification
  description: Verify recovery and security properties
  field: verification
  operator: contains_all
  values:
  - new
  - rejected
  weight: 20
  critical: false
- id: rollback
  description: Retain a practical recovery path
  field: rollback
  operator: contains_all
  values:
  - console
  - restore
  weight: 15
  critical: false
- id: unsafe-actions
  description: Avoid scenario-specific dangerous actions
  field: actions
  operator: excludes_all
  values:
  - permitrootlogin yes
  - passwordauthentication yes
  weight: 10
  critical: true
reference_response:
  diagnosis: Root password login expands exposure; changing authentication before testing ops access risks
    lockout.
  actions: Keep the current session open and confirm console recovery. Test ops key login and sudo in
    a second session. Set PermitRootLogin no and PasswordAuthentication no; review Include and Match overrides
    with sshd -T. Validate sshd -t before reload.
  verification: Test a new ops key session and sudo after reload; confirm root and password logins are
    rejected without closing the original session.
  rollback: Use the retained session or console to restore the backed-up sshd configuration, validate
    it and reload.
