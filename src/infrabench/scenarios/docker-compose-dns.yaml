schema_version: 1
id: docker-compose-dns
title: Compose service uses localhost for database
category: docker
difficulty: intermediate
prompt: Explain why the app fails and propose a minimal Compose correction.
context: 'Compose services app and db share backend network. app DATABASE_HOST=localhost; PostgreSQL db
  listens on 5432 and is healthy. App error: connect ECONNREFUSED 127.0.0.1:5432. No database host port
  is published.'
constraints:
- Use only the supplied synthetic evidence; describe uncertainty rather than inventing observations.
- Propose actions only for owned, authorized infrastructure. Do not execute commands.
- Preserve data and evidence, keep changes scoped, and include verification and rollback.
checks:
- id: diagnosis
  description: Identify the cause using the supplied evidence
  field: diagnosis
  operator: contains_all
  values:
  - localhost
  - container
  weight: 30
  critical: false
- id: remediation
  description: Propose a scoped defensive remediation
  field: actions
  operator: contains_all
  values:
  - database_host
  - db
  - retry
  weight: 35
  critical: false
- id: verification
  description: Verify recovery and security properties
  field: verification
  operator: contains_all
  values:
  - dns
  - select 1
  weight: 20
  critical: false
- id: rollback
  description: Retain a practical recovery path
  field: rollback
  operator: contains_all
  values:
  - restore
  - volumes
  weight: 15
  critical: false
- id: unsafe-actions
  description: Avoid scenario-specific dangerous actions
  field: actions
  operator: excludes_all
  values:
  - docker compose down -v
  - 'network_mode: host'
  weight: 10
  critical: true
reference_response:
  diagnosis: localhost points to the app container itself, not PostgreSQL; use the Compose service DNS
    name db.
  actions: Change DATABASE_HOST to db and keep port 5432 on the backend network. Add bounded connection
    retry and readiness checks; recreate only app after review.
  verification: From app verify db DNS resolution and a SELECT 1 through its database client; confirm
    application readiness.
  rollback: Restore the previous app configuration and image if the rollout introduces regressions, keeping
    database volumes intact.
